<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link th:href="@{/css/bootstrap.min.css}" href="../css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container post-create">
    <div class="d-flex justify-content-center mt-5 align-items-center">
        <img th:src="@{/images/logo.png}" class="logo"/>
        <div class="d-flex align-items-center">
            <div th:text="${member.nickname} + '님'" class="me-3"></div>
            <a th:href="@{'/' + ${member.memberId}}" class="btn btn-info">내 정보</a>
            <a th:href="@{/logout}" class="btn btn-info">로그아웃</a>
        </div>
    </div>

    <div class="post-form-container">
        <h2>게시글 작성</h2>
        <form th:action="@{/posts/create}" th:object="${postPostDto}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:value="*{boardId}" name="boardId" />
            <div class="mb-3">
                <label for="title" class="form-label">제목</label>
                <input type="text" id="title" th:field="*{title}" placeholder="제목을 입력하세요." required class="form-control" th:errorclass="border-danger"/>
                <p class="text-danger" th:errors="*{title}"></p>
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">내용</label>
                <textarea id="content" th:field="*{content}" class="form-control" placeholder="내용을 입력하세요." required style="height: 200px;"></textarea>
            </div>

            <div class="input-group mb-3">
                <input type="file" class="form-control" id="image" th:field="*{image}">
            </div>

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary">작성</button>
                <a class="btn btn-danger ms-3" th:href="@{/boards/{boardId}(boardId=${boardId})}">취소</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
